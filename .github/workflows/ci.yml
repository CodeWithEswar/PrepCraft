name: Application checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run architecture:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run brand:validate
      - run: npm run landing:validate
      - run: npm run build
