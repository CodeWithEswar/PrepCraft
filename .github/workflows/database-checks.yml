name: Database checks
on:
  pull_request:
    paths: ['supabase/**', 'src/lib/supabase/**', 'scripts/database/**', '.github/workflows/database-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:check
      - run: npx supabase start
      - run: npx supabase db reset --local
      - run: npm run db:types:check
      - run: npm run test:platform:db
      - run: npm run db:lint
      - run: npm run db:test
      - if: always()
        run: npx supabase stop --no-backup
